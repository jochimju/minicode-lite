[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-lite"
version = "0.0.1"
description = "A learning-first MiniCode harness rebuilt in small verified stages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
minicode-lite = "minicode_lite.main:main"
minicode-lite-headless = "minicode_lite.headless:main"
minicode-lite-repl = "minicode_lite.repl:run_repl"
minicode-lite-release = "minicode_lite.release_gate:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_qwen: calls configured DashScope Qwen endpoint and may consume API quota",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["minicode_lite*"]
